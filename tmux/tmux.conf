set -g default-terminal "tmux-256color"
# True colour, undercurl and extended keys; fixed index so reloads overwrite instead of appending
set -s terminal-features[3] "xterm*:RGB:usstyle:extkeys"
set -g extended-keys on
set -g escape-time 10
set -g focus-events on
# Let programs send images (Kitty graphics protocol) through tmux to Ghostty
set -g allow-passthrough on
# Always use tmux's dark palette: Ghostty is detected as light despite its dark background
set -g theme dark

set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
# Closing a session's last window switches to another session instead of detaching
set -g detach-on-destroy off
# Never land the main view on the floating terminal's session (its own client runs inside tmux, hence tmux*)
set-hook -g client-session-changed "if -F '#{&&:#{==:#{session_name},popup},#{!:#{m:tmux*,#{client_termname}}}}' 'switch-client -n ; if -F \"#{==:#{client_session},popup}\" detach-client'"
# Window name: "claude" for its versioned binary, else the command line from Pure's title, else the program
set -g automatic-rename-format "#{?#{m/r:^[0-9.]+$,#{pane_current_command}},claude,#{?#{m:#{b:pane_current_path}: *,#{pane_title}},#{s/^[^ ]+ //;=/30/…:pane_title},#{pane_current_command}}}"

# Two-line status bar whose blank first line pads above the bar; reset first so reloads don't copy the blank line
set -gu status-format
set -g status 2
set -gF status-format[1] "#{status-format[0]}"
set -g status-format[0] "#[fill=terminal]"
%hidden ACCENT="#EBCB8B"
%hidden BAR="#2E3440"
%hidden CURRENT="#3B4252"
set -g status-left "#[fg=$ACCENT,bg=terminal] #[bg=$ACCENT,fg=#191D24,bold] #S #[default] "
set -g status-left-length 40
# Number of sessions besides the current one, ignoring the floating terminal
%hidden OTHER_SESSIONS="#{e|-:#{n:#{S:#{?#{==:#{session_name},popup},,x}}},1}"
# Git branch of the active pane's directory
%hidden BRANCH="#(git -C #{q:pane_current_path} branch --show-current 2>/dev/null)"
set -g status-right "#{?#{!=:$BRANCH,},#[fg=$ACCENT] $BRANCH ,}#{?#{e|>:$OTHER_SESSIONS,0},#[bg=$CURRENT#,fg=#d8dee9] +$OTHER_SESSIONS #[fg=$CURRENT#,bg=terminal],#[fg=$BAR#,bg=terminal]} "
set -g status-right-length 60
set -g status-interval 5
set -g status-style "bg=$BAR,fg=#60728A"
set -g window-status-style default
set -g window-status-current-style "bg=$CURRENT,fg=#d8dee9,underscore,us=$ACCENT"
set -g window-status-format "  #W#{?window_zoomed_flag, Z,}  "
set -g window-status-current-format "  #W#{?window_zoomed_flag, Z,}  "
set -g window-status-separator ""

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
# Copy through pbcopy so copies from the floating terminal also reach the clipboard
set -s copy-command "pbcopy"
# Mouse selections copy on release but stay highlighted until Cmd-c (prefix Y) or q
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear
bind -T copy-mode-vi WheelUpPane select-pane \; send -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send -X -N 1 scroll-down
# Copy the copy-mode selection and leave copy mode; does nothing outside copy mode
bind Y if -F "#{pane_in_mode}" "send -X copy-pipe-and-cancel"

# Reload Ghostty, tmux and every Neovim
bind r run-shell "reload-configs" \; display "Configurations reloaded"

# Alt-h/t/c/n: Neovim moves between its splits and hands over to tmux at its edges
%hidden IS_NVIM="#{m/r:^n?vim$,#{pane_current_command}}"
bind -n M-h if -F "$IS_NVIM" "send-keys M-h" "select-pane -L"
bind -n M-t if -F "$IS_NVIM" "send-keys M-t" "select-pane -D"
bind -n M-c if -F "$IS_NVIM" "send-keys M-c" "select-pane -U"
bind -n M-n if -F "$IS_NVIM" "send-keys M-n" "select-pane -R"

bind -r H swap-pane -d -t "{left-of}"
bind -r T swap-pane -d -t "{down-of}"
bind -r C swap-pane -d -t "{up-of}"
bind -r N swap-pane -d -t "{right-of}"

bind -n M-S-Left resize-pane -L 5
bind -n M-S-Down resize-pane -D 3
bind -n M-S-Up resize-pane -U 3
bind -n M-S-Right resize-pane -R 5

# Spread panes evenly whenever one is added or removed
set-hook -g after-split-window "select-layout -E"
set-hook -g after-kill-pane "select-layout -E"
set-hook -g pane-exited "select-layout -E"

# Only split panes of at least 30 columns or 8 rows: the even spreading would otherwise keep splitting into tiny panes
bind v if -F "#{e|>=:#{pane_width},30}" { split-window -h -c "#{pane_current_path}" } { display "Pane too small to split" }
bind s if -F "#{e|>=:#{pane_height},8}" { split-window -v -c "#{pane_current_path}" } { display "Pane too small to split" }
bind c new-window -c "#{pane_current_path}"

bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

set -g popup-style default
set -g popup-border-lines rounded
set -g popup-border-style "fg=themegreen"

bind o display-popup -E -w 60% -h 60% -T " Sessions " "~/.config/tmux/sessionizer"
bind O display-popup -E -w 60% -h 60% -T " Repositories " "~/.config/tmux/sessionizer --repositories"
# Cycle through sessions, skipping the floating terminal
bind ) switch-client -n \; if -F "#{==:#{client_session},popup}" "switch-client -n"
bind ( switch-client -p \; if -F "#{==:#{client_session},popup}" "switch-client -p"

# Toggle the floating terminal, a persistent session named "popup" shown in a popup
bind t if -F "#{==:#{session_name},popup}" {
  detach-client
} {
  display-popup -E -w 80% -h 80% -T " Terminal " -d "#{pane_current_path}" "tmux new-session -A -s popup \\; set-option -t popup status off \\; set-option -t popup detach-on-destroy on"
}
